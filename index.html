<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WBSO Lube Stock Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; }
    .tab-active { border-bottom: 3px solid #f97316; color: #ea580c; font-weight: 700; background-color: #fff7ed; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white p-4 shadow-md sticky top-0 z-20 border-b border-blue-900/50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-orange-400 flex items-center gap-2">
          ⚡ WBSO Stock Portal
        </h1>
        <p id="fileStatus" class="text-[11px] text-slate-300 font-medium">Synced live from GitHub</p>
      </div>
      <label class="bg-slate-800 hover:bg-slate-700 border border-slate-700 active:scale-95 text-slate-200 text-xs font-semibold py-2 px-3 rounded-xl shadow-sm cursor-pointer transition flex items-center gap-1.5">
        <span>📂 Override</span>
        <input type="file" id="excelUpload" accept=".xlsx, .xls" class="hidden">
      </label>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="bg-white shadow-sm sticky top-[65px] z-10 border-b border-slate-200 overflow-x-auto">
    <div class="max-w-7xl mx-auto flex text-xs sm:text-sm text-slate-600 whitespace-nowrap">
      <button onclick="switchTab('search')" id="tab-search" class="flex-1 py-3 px-4 text-center tab-active transition">🔍 Stock Search</button>
      <button onclick="switchTab('cfa')" id="tab-cfa" class="flex-1 py-3 px-4 text-center transition">📊 CFA Fixed</button>
      <button onclick="switchTab('transfer')" id="tab-transfer" class="flex-1 py-3 px-4 text-center transition">🚚 CIP to CFA</button>
      <button onclick="switchTab('hero')" id="tab-hero" class="flex-1 py-3 px-4 text-center transition">🏍️ Hero BO</button>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto p-3 sm:p-5">

    <!-- TAB 1: STOCK SEARCH -->
    <section id="view-search" class="space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 space-y-3">
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">🔍</span>
          <input type="text" id="stockSearchInput" oninput="renderStockSearch()" placeholder="Type to search material code or grade (e.g., 7420401, 4T, PRIDE)..." class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition">
        </div>
        <select id="plantFilter" onchange="renderStockSearch()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-orange-500">
          <option value="ALL">All Plants & CFAs</option>
        </select>
      </div>
      <div class="flex justify-between items-center px-1">
        <div id="stockSummary" class="text-xs text-slate-500 font-semibold"></div>
        <div class="text-[11px] text-orange-600 font-bold bg-orange-50 px-2.5 py-1 rounded-lg border border-orange-100">✨ Rectangular Grid View</div>
      </div>
      <!-- Strict 3-Column Rectangular Grid -->
      <div id="stockResults" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- TAB 2: CFA DASHBOARD FIXED -->
    <section id="view-cfa" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80">
        <input type="text" id="cfaSearchInput" oninput="renderCFADashboard()" placeholder="Filter SKU Code or Grade (e.g., TMGO, 15W-40)..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
      </div>
      <div id="cfaResults" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- TAB 3: STOCK TRANSFER CIP TO CFA -->
    <section id="view-transfer" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80">
        <select id="transferCfaFilter" onchange="renderTransfers()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700">
          <option value="ALL">All Destination CFAs</option>
        </select>
      </div>
      <div id="transferSummary" class="bg-gradient-to-r from-blue-900 to-slate-900 text-white p-4 rounded-2xl shadow-sm flex justify-between items-center text-sm font-semibold"></div>
      <div id="transferResults" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- TAB 4: HERO BO -->
    <section id="view-hero" class="hidden space-y-4">
      <div id="heroResults" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

  </main>

  <script>
    let db = { stock: [], cfaFixed: [], transfers: [], heroBO: [] };

    window.addEventListener('DOMContentLoaded', () => {
      fetch('WBSO%20Stock%20Dasboard%20Mac.xlsx')
        .then(res => {
          if (!res.ok) throw new Error("File not found");
          return res.arrayBuffer();
        })
        .then(buf => processWorkbook(XLSX.read(buf, { type: 'array' }), "Synced live from GitHub"))
        .catch(() => {
          document.getElementById('fileStatus').innerText = "Manual override ready";
        });
    });

    document.getElementById('excelUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('fileStatus').innerText = "Reading " + file.name + "...";
      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        processWorkbook(workbook, "Loaded: " + file.name);
      };
      reader.readAsArrayBuffer(file);
    });

    function processWorkbook(workbook, statusText) {
      document.getElementById('fileStatus').innerText = statusText;

      if (workbook.Sheets['Stock']) {
        db.stock = XLSX.utils.sheet_to_json(workbook.Sheets['Stock']);
        populatePlantDropdown();
      }
      if (workbook.Sheets['Dashboard Fixed']) {
        db.cfaFixed = XLSX.utils.sheet_to_json(workbook.Sheets['Dashboard Fixed']);
      }
      if (workbook.Sheets['Stock Transfer from CIP to CFA']) {
        db.transfers = XLSX.utils.sheet_to_json(workbook.Sheets['Stock Transfer from CIP to CFA']);
        populateTransferDropdown();
      }
      if (workbook.Sheets['Hero BO']) {
        db.heroBO = XLSX.utils.sheet_to_json(workbook.Sheets['Hero BO']);
      }

      renderStockSearch();
      renderCFADashboard();
      renderTransfers();
      renderHero();
    }

    function populatePlantDropdown() {
      const plants = [...new Set(db.stock.map(r => r['Name 1']).filter(Boolean))].sort();
      const select = document.getElementById('plantFilter');
      select.innerHTML = '<option value="ALL">All Plants & CFAs (' + plants.length + ' Locations)</option>' +
        plants.map(p => `<option value="${p}">${p}</option>`).join('');
    }

    function populateTransferDropdown() {
      const cfas = [...new Set(db.transfers.map(r => (r['CFA'] || '').trim()).filter(Boolean))].sort();
      const select = document.getElementById('transferCfaFilter');
      select.innerHTML = '<option value="ALL">All Destination CFAs</option>' +
        cfas.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // TAB 1 RENDER: Rectangular Grid Layout with Combined Totals
    function renderStockSearch() {
      const q = (document.getElementById('stockSearchInput').value || '').toLowerCase().trim();
      const plant = document.getElementById('plantFilter').value;
      const container = document.getElementById('stockResults');

      let filtered = db.stock.filter(row => {
        const mat = String(row['Material'] || '').toLowerCase();
        const desc = String(row['Material Description'] || '').toLowerCase();
        const locName = String(row['Name 1'] || '');
        const matchQuery = !q || mat.includes(q) || desc.includes(q);
        const matchPlant = (plant === 'ALL') || (locName === plant);
        return matchQuery && matchPlant && (Number(row['Unrestricted'] || 0) > 0 || Number(row['Transit and Transfer'] || 0) > 0);
      });

      let aggregatedMap = {};
      filtered.forEach(row => {
        const material = String(row['Material'] || '').trim();
        const locName = String(row['Name 1'] || '').trim();
        const key = material + "_" + locName;

        if (!aggregatedMap[key]) {
          aggregatedMap[key] = {
            Material: row['Material'],
            'Material Description': row['Material Description'],
            'Base Unit of Measure': row['Base Unit of Measure'] || 'BRL',
            'Name 1': row['Name 1'],
            Unrestricted: 0,
            'Transit and Transfer': 0
          };
        }
        aggregatedMap[key].Unrestricted += Number(row['Unrestricted'] || 0);
        aggregatedMap[key]['Transit and Transfer'] += Number(row['Transit and Transfer'] || 0);
      });

      let combinedList = Object.values(aggregatedMap);

      document.getElementById('stockSummary').innerText = `Showing ${Math.min(combinedList.length, 30)} of ${combinedList.length} items`;

      container.innerHTML = combinedList.slice(0, 30).map(r => `
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 hover:shadow-md transition flex flex-col justify-between relative overflow-hidden group">
          <div class="absolute left-0 top-0 bottom-0 w-2 bg-blue-600"></div>
          <div>
            <div class="flex items-center justify-between gap-1.5 mb-2 pl-1">
              <span class="text-[11px] font-extrabold bg-blue-50 text-blue-900 px-2.5 py-1 rounded-lg border border-blue-100">${r['Material']}</span>
              <span class="text-[11px] font-bold text-orange-700 bg-orange-50 px-2.5 py-1 rounded-lg truncate max-w-[160px] border border-orange-100">${r['Name 1']}</span>
            </div>
            <h3 class="text-xs sm:text-sm font-bold text-slate-900 tracking-tight line-clamp-2 mb-4 pl-1">${r['Material Description']}</h3>
          </div>
          <div class="pt-3 border-t border-slate-100 flex justify-between items-center bg-slate-50/70 -mx-4 -mb-4 p-3.5 rounded-b-2xl">
            <div>
              <div class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Available Stock</div>
              <div class="text-base font-extrabold text-emerald-700">${r['Unrestricted']} <span class="text-xs font-semibold text-slate-500">${r['Base Unit of Measure']}</span></div>
            </div>
            ${r['Transit and Transfer'] > 0 ? `
              <div class="text-right">
                <div class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Transit</div>
                <div class="text-sm font-bold text-amber-600">${r['Transit and Transfer']}</div>
              </div>` : ''}
          </div>
        </div>
      `).join('');
    }

    function renderCFADashboard() {
      const q = (document.getElementById('cfaSearchInput').value || '').toLowerCase().trim();
      const container = document.getElementById('cfaResults');
      let filtered = db.cfaFixed.filter(r => {
        const code = String(r['SKU Code'] || '').toLowerCase();
        const desc = String(r['SKU Description'] || '').toLowerCase();
        return code && (!q || code.includes(q) || desc.includes(q));
      });

      container.innerHTML = filtered.map(r => `
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 space-y-3 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start border-b border-slate-100 pb-2 mb-2">
              <span class="text-xs font-bold text-blue-900 bg-blue-50 px-2.5 py-1 rounded-lg">${r['SKU Code']}</span>
              <span class="text-[10px] bg-slate-100 text-slate-700 font-bold px-2 py-1 rounded-lg">CIP: ${r['CIP Kolkata'] || 'A-0;T-0'}</span>
            </div>
            <h3 class="text-xs sm:text-sm font-bold text-slate-900 line-clamp-2">${r['SKU Description']}</h3>
          </div>
          <div class="grid grid-cols-3 gap-1.5 text-center text-xs pt-2">
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
              <div class="font-bold text-slate-700 text-[11px]">Mourigram</div>
              <div class="text-[10px] text-slate-500">${r['CFA-MOURIGRAM'] || '-'}</div>
              <div class="mt-1 font-bold ${Number(r['Shortfall/Excess Qty (No of SKU) for CFA Mourigram']) > 0 ? 'text-red-600' : 'text-emerald-600'}">
                Req: ${r['Shortfall/Excess Qty (No of SKU) for CFA Mourigram'] || 0}
              </div>
            </div>
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
              <div class="font-bold text-slate-700 text-[11px]">Rajbandh</div>
              <div class="text-[10px] text-slate-500">${r['CFA-RAJBANDH'] || '-'}</div>
              <div class="mt-1 font-bold ${Number(r['Shortfall/Excess Qty (No of SKU) for CFA Rajbandh']) > 0 ? 'text-red-600' : 'text-emerald-600'}">
                Req: ${r['Shortfall/Excess Qty (No of SKU) for CFA Rajbandh'] || 0}
              </div>
            </div>
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
              <div class="font-bold text-slate-700 text-[11px]">Raninagar</div>
              <div class="text-[10px] text-slate-500">${r['CFA-RANINAGAR (LUBE)'] || '-'}</div>
              <div class="mt-1 font-bold ${Number(r['Shortfall/Excess Qty (No of SKU) for CFA Raninagar']) > 0 ? 'text-red-600' : 'text-emerald-600'}">
                Req: ${r['Shortfall/Excess Qty (No of SKU) for CFA Raninagar'] || 0}
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderTransfers() {
      const cfa = document.getElementById('transferCfaFilter').value;
      const filtered = db.transfers.filter(r => cfa === 'ALL' || (r['CFA'] || '').trim() === cfa);
      const totalKL = filtered.reduce((sum, r) => sum + (Number(r['Qty in KL']) || 0), 0);

      document.getElementById('transferSummary').innerHTML = `
        <span>Total Items: ${filtered.length} SKUs</span>
        <span class="text-orange-300">Volume: ${totalKL.toFixed(2)} KL</span>
      `;

      document.getElementById('transferResults').innerHTML = filtered.map(r => `
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between gap-1.5 mb-2">
              <span class="text-[11px] font-bold text-blue-900 bg-blue-50 px-2.5 py-1 rounded-lg">${r['SKU Code']}</span>
              <span class="text-[11px] bg-orange-100 text-orange-800 font-semibold px-2.5 py-1 rounded-lg">${(r['CFA'] || '').trim()}</span>
            </div>
            <h4 class="text-xs sm:text-sm font-bold text-slate-900 line-clamp-2">${r['SKU Description']}</h4>
          </div>
          <div class="mt-3 pt-3 border-t border-slate-100 flex justify-between items-center bg-slate-50/70 -mx-4 -mb-4 p-3.5 rounded-b-2xl">
            <span class="text-xs font-bold text-slate-700">Qty: ${r['Qty '] || r['Qty'] || 0}</span>
            <span class="text-xs font-extrabold text-blue-700">${Number(r['Qty in KL'] || 0).toFixed(2)} KL</span>
          </div>
        </div>
      `).join('');
    }

    function renderHero() {
      document.getElementById('heroResults').innerHTML = db.heroBO.map(r => `
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col justify-between relative overflow-hidden">
          <div class="absolute left-0 top-0 bottom-0 w-2 bg-red-500"></div>
          <div class="pl-1">
            <div class="flex justify-between items-center mb-1.5">
              <span class="text-[10px] font-bold text-slate-400">PO: ${r['PO No']}</span>
              <span class="text-[10px] font-bold text-slate-500">IOC: ${r['IOC Code']}</span>
            </div>
            <h4 class="text-xs sm:text-sm font-bold text-slate-900 line-clamp-2 mb-2">${r['Part Desc.']}</h4>
            <span class="text-[11px] text-slate-500 block">Part No: ${r['Part No.']} (Pack: ${r['Pack Size']})</span>
          </div>
          <div class="mt-3 pt-3 border-t border-slate-100 flex justify-between items-center bg-red-50/50 -mx-4 -mb-4 p-3.5 rounded-b-2xl">
            <div class="text-sm font-extrabold text-red-600">${r['Order Qty']} Nos</div>
            <div class="text-xs text-slate-700 font-bold">${r['Qty in Carton']} Cartons</div>
          </div>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      ['search', 'cfa', 'transfer', 'hero'].forEach(t => {
        document.getElementById('view-' + t).classList.add('hidden');
        document.getElementById('tab-' + t).classList.remove('tab-active');
      });
      document.getElementById('view-' + tab).classList.remove('hidden');
      document.getElementById('tab-' + tab).classList.add('tab-active');
    }
  </script>
</body>
</html>
